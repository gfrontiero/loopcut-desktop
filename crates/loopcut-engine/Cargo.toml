[package]
name = "loopcut-engine"
version = { workspace = true }
authors = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
oasgen = { workspace = true }

loopcut-events = { path = "../loopcut-events" }
loopcut-screen = { path = "../loopcut-screen" }
loopcut-audio = { path = "../loopcut-audio" }
loopcut-core = { path = "../loopcut-core", features = ["security", "cloud-sync"] }
loopcut-db = { path = "../loopcut-db" }
loopcut-a11y = { path = "../loopcut-a11y", features = ["db"] }
loopcut-apple-intelligence = { path = "../loopcut-apple-intelligence", optional = true }
loopcut-config = { path = "../loopcut-config" }
loopcut-connect = { path = "../loopcut-connect" }
loopcut-vault = { path = "../loopcut-vault" }


# Image processing
image = { workspace = true }
imageproc = "0.25"

# Dates
chrono = { version = "0.4.31", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = [
    "sqlite",
    "runtime-tokio-rustls",
    "chrono",
    "migrate",
] }

anyhow = "1.0.86"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }

#opentelemetry
sentry = { workspace = true }

# Server
axum = { version = "0.7.5", features = ["ws", "multipart"] }
http-body-util = "0.1"
tokio = { version = "1.15", features = ["full", "tracing"] }
tokio-stream = "0.1"
tower-http = { version = "0.5.2", features = ["cors", "trace"] }

# Log
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
console-subscriber = { version = "0.4.1", optional = true }
# Cli ! shouldn't be required if using as lib
clap = { version = "4.3", features = ["derive", "env"] }

# Memory watchdog
sysinfo = "0.29.0"

# Color
colored = "2.0"

# Plugins
futures = { version = "0.3.31", features = ["std"] }

# Directory management
dirs = "5.0"

# Password input (no-echo for vault CLI)
rpassword = "5"

# Client http
reqwest = { workspace = true }

# Concurrency
crossbeam = { workspace = true }

# base64
base64 = "0.22.1"

uuid = { version = "1.5.0", features = ["v4"] }

# Cloud sync utilities
hostname = "0.4"
md5 = "0.7"

tempfile = "3.3.0"


# Bincode for serializing hot cache
bincode = "1.3.3"

# SHA256 for hashing
sha2 = "0.10.6"

# Fast random number generator
fastrand = "2.1.1"
port_check = "0.2.1"

regex = "1.10.0"

lru = "0.16.3"
tokio-util = { version = "0.7", features = ["io"] }

once_cell = { workspace = true }
dashmap = { workspace = true }

# Heap profiling (opt-in via --features heap-prof)
dhat = { version = "0.3", optional = true }

# jemalloc — aggressively returns freed pages to OS, reducing RSS bloat from fragmentation.
# Default allocator on macOS/Linux. Not used on Windows (unsupported).
[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[dev-dependencies]
env_logger = "0.10"
tempfile = "3.3.0"
tokio-tungstenite = "0.24"
tower = { version = "0.4", features = ["util"] }

# Benches
criterion = { workspace = true }

[features]
default = ["qwen3-asr", "parakeet"]
metal = ["loopcut-audio/metal"]
heap-prof = ["dhat"]
cuda = ["loopcut-audio/cuda"]
directml = ["loopcut-audio/directml"]
vulkan = ["loopcut-audio/vulkan"]
debug-console = ["console-subscriber"]
pulseaudio = ["loopcut-audio/pulseaudio"]
apple-intelligence = ["dep:loopcut-apple-intelligence"]
qwen3-asr = ["loopcut-audio/qwen3-asr"]
parakeet = ["loopcut-audio/parakeet"]
parakeet-mlx = ["loopcut-audio/parakeet-mlx"]
jemalloc = ["tikv-jemallocator"]

[[bin]]
name = "loopcut"
path = "src/bin/screenpipe-engine.rs"


[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Foundation",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }
socket2 = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { git = "https://github.com/yury/cidre.git", features = ["ax", "ns", "av", "blocks"] }
tracing-oslog = { workspace = true }
