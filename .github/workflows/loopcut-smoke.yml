name: Loopcut independent smoke test

on:
  push:
    branches:
      - codex/loopcut-smoke-20260906-04d243
    paths:
      - qa/loopcut-smoke/**
      - .github/workflows/loopcut-smoke.yml
      - .github/workflows/e2e-macos.yml
      - .github/workflows/ci.yml
      - .github/workflows/e2e-test.yml
      - .github/workflows/windows-integration-test.yml
      - crates/loopcut-engine/Cargo.toml
      - crates/loopcut-audio/Cargo.toml
      - crates/loopcut-core/assets/pipes/automate-my-work/**
      - crates/loopcut-core/src/pipes/mod.rs
      - apps/loopcut-app-tauri/lib/summary-templates.ts
      - apps/loopcut-app-tauri/lib/automation-audit.ts
      - apps/loopcut-app-tauri/lib/automation-audit-report.ts
      - apps/loopcut-app-tauri/components/standalone-chat.tsx
      - apps/loopcut-app-tauri/components/chat/summary-cards.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopcut-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source targets and audit entry points
        run: python qa/loopcut-smoke/preflight.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopcut-source-preflight
          path: qa-results/source-preflight.json
          if-no-files-found: error
          retention-days: 30

  privacy-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Exercise production collector, dispatch gating and sanitizer
        run: bun test qa/loopcut-smoke/privacy.test.ts qa/loopcut-smoke/audit-prompt.test.ts qa/loopcut-smoke/audit-evidence.test.ts qa/loopcut-smoke/audit-report.test.ts
      - name: Type-check the production evidence collector
        run: bunx --package typescript@5.9.3 tsc --noEmit --strict --target ES2020 --lib ES2020,DOM --module esnext --moduleResolution bundler apps/loopcut-app-tauri/lib/automation-audit.ts apps/loopcut-app-tauri/lib/automation-audit-report.ts
      - name: Compile the desktop card syntax
        run: bun build apps/loopcut-app-tauri/components/chat/summary-cards.tsx apps/loopcut-app-tauri/components/standalone-chat.tsx --target browser --external '*' --outdir /tmp/loopcut-ui

  released-mac:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Set up a local model for the synthetic audit
        run: python qa/loopcut-smoke/setup_local_model.py
      - name: Verify the published Mac beta and run the real pipe engine
        env:
          LOOPCUT_AUDIT_TEST: "1"
        run: python qa/loopcut-smoke/mac_release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loopcut-mac-release-smoke
          path: qa-results/
          if-no-files-found: error
          retention-days: 30
